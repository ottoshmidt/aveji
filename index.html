<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aveji</title>
    <meta name="description" content="Kitchen cabinets and cut lists for the workshop." />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>Aveji</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <nav class="languages" id="languages" aria-label="Language"></nav>
    </header>

    <main>
      <section class="panel project no-print">
        <h2 data-i18n="project"></h2>
        <label class="field wide">
          <span data-i18n="projects"></span>
          <select id="project-select"></select>
        </label>
        <label class="field wide project-name">
          <span data-i18n="projectName"></span>
          <input id="project-name" type="text" autocomplete="off" />
        </label>
        <div class="buttons">
          <button type="button" id="new-project" data-i18n="newProject"></button>
          <button type="button" id="duplicate-project" data-i18n="duplicateProject"></button>
          <button type="button" id="delete-project" class="danger" data-i18n="deleteProject"></button>
        </div>
        <div class="buttons">
          <button type="button" id="save-file" data-i18n="saveFile"></button>
          <button type="button" id="open-file" data-i18n="openFile"></button>
          <input id="file-input" type="file" accept=".json,application/json" hidden />
        </div>
        <p class="status" id="project-status" role="status"></p>
        <p class="muted storage-note" data-i18n="storageNote"></p>

        <details class="settings">
          <summary data-i18n="settings"></summary>
          <div class="grid" id="settings">
            <label class="field"><span data-i18n="board"></span><span class="unit"><input data-setting="board" type="number" min="1" step="0.5" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="doorGap"></span><span class="unit"><input data-setting="doorGap" type="number" min="0" step="0.5" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="shelfSetback"></span><span class="unit"><input data-setting="shelfSetback" type="number" min="0" step="1" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="railWidth"></span><span class="unit"><input data-setting="railWidth" type="number" min="1" step="1" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="hangingRail"></span><span class="unit"><input data-setting="hangingRail" type="number" min="0" step="1" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="backReveal"></span><span class="unit"><input data-setting="backReveal" type="number" min="0" step="0.5" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="drawerFrontHeight"></span><span class="unit"><input data-setting="drawerFrontHeight" type="number" min="1" step="1" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="drawerBoard"></span><span class="unit"><input data-setting="drawerBoard" type="number" min="1" step="0.5" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="runnerClearance"></span><span class="unit"><input data-setting="runnerClearance" type="number" min="0" step="0.5" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="worktopDepth"></span><span class="unit"><input data-setting="worktopDepth" type="number" min="1" step="1" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="worktopThickness"></span><span class="unit"><input data-setting="worktopThickness" type="number" min="1" step="1" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="worktopOverhangLeft"></span><span class="unit"><input data-setting="worktopOverhangLeft" type="number" min="0" step="1" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="worktopOverhangRight"></span><span class="unit"><input data-setting="worktopOverhangRight" type="number" min="0" step="1" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="worktopMaxLength"></span><span class="unit"><input data-setting="worktopMaxLength" type="number" min="1" step="1" inputmode="decimal" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="carcassMaterial"></span><input data-setting="carcassMaterial" type="text" /></label>
            <label class="field"><span data-i18n="frontMaterial"></span><input data-setting="frontMaterial" type="text" /></label>
            <label class="field"><span data-i18n="backMaterial"></span><input data-setting="backMaterial" type="text" /></label>
            <label class="field"><span data-i18n="drawerMaterial"></span><input data-setting="drawerMaterial" type="text" /></label>
            <label class="field"><span data-i18n="worktopMaterial"></span><input data-setting="worktopMaterial" type="text" /></label>
            <label class="field"><span data-i18n="carcassEdge"></span><span class="unit"><input data-setting="carcassEdge" type="text" /><span data-i18n="mm"></span></span></label>
            <label class="field"><span data-i18n="frontEdge"></span><span class="unit"><input data-setting="frontEdge" type="text" /><span data-i18n="mm"></span></span></label>
            <label class="check wide-check"><input data-setting="worktop" type="checkbox" /> <span data-i18n="worktopInList"></span></label>
          </div>
        </details>
      </section>

      <section class="panel no-print">
        <h2 data-i18n="cabinets"></h2>
        <p class="muted" id="no-cabinets" data-i18n="noCabinets"></p>
        <ol class="cabinets" id="cabinets"></ol>
        <div class="buttons">
          <button type="button" class="primary" id="add-base" data-i18n="addBase"></button>
          <button type="button" class="primary" id="add-wall" data-i18n="addWall"></button>
          <button type="button" class="primary" id="add-tall" data-i18n="addTall"></button>
        </div>
      </section>

      <section class="panel" id="drawing-panel">
        <h2 data-i18n="drawing"></h2>
        <p class="print-only print-title" id="print-title"></p>
        <div class="drawing" id="drawing"></div>
      </section>

      <section class="panel">
        <h2 data-i18n="parts"></h2>
        <label class="check no-print"><input id="merge" type="checkbox" /> <span data-i18n="merge"></span></label>
        <p class="muted" id="no-parts" data-i18n="noParts"></p>
        <div class="table-wrap">
          <table class="parts" id="parts-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="legend" data-i18n="legend"></p>
        <div class="totals" id="totals"></div>

        <div class="export no-print">
          <h3 data-i18n="export"></h3>
          <label class="field wide">
            <span data-i18n="delimiter"></span>
            <select id="delimiter">
              <option value=";" data-i18n="delimiter.semicolon"></option>
              <option value="," data-i18n="delimiter.comma"></option>
            </select>
          </label>
          <div class="buttons">
            <button type="button" class="primary" id="download-csv" data-i18n="downloadCsv"></button>
            <button type="button" id="copy-table" data-i18n="copyTable"></button>
            <button type="button" id="print" data-i18n="print"></button>
          </div>
          <p class="status" id="status" role="status"></p>
        </div>
      </section>
    </main>
  </body>
</html>
